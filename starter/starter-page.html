<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viktor's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="starter.css">
</head>
<body>
  <header>
    <div class="lines-top-container">
      <hr class="lines">
    </div>
    <div>
      <h1 class="header-top-title">Gradim moderne i brze eb interfejse</h1>
    </div>
    <p class="hedader-text">Fokusiran sam na čist HTML i CSS, responsive dizajn i 
      interaktivne UI elemente. Svaki projekat pravim sa pažnjom na 
      detalje i jednostavnost korišćenja.
    </p>
    <div class="button-card">
      <button class="header-btn">
        Pogledaj projekte
      </button>
    </div>
  </header>
  <main>
    <div class="full-line-container">
      <hr class="full-line">
    </div>
    <section class="about-me-title">
      <div class="lines-top-container">
        <hr class="lines">
      </div>
      <h2 class="secondary-color">O MENI</h2>
      <div class="lines-top-container">
        <hr class="lines">
      </div>
    </section>
    
    <div class="about-me-text">
      <p class="secondary-color">Fontend developer fokusiran na čist HTML, CSS, JS i UX detalje.</p>
    </div>

    <section class="about-me-card-container">
      <div class="about-me-container">
        <div class="about-me-card">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <p class="secondary-color">Brzina</p>
      </div>
      <div class="about-me-container">
        <div class="about-me-card">
          <i class="fa-regular fa-lightbulb"></i>
        </div>
        <p class="secondary-color">Dizajn</p>
      </div>
      <div class="about-me-container">
        <div class="about-me-card">
          <i class="fa-solid fa-tv"></i>
        </div>
        <p class="secondary-color">Resposive</p>
    </section>
    <hr class="full-line">
  </main>
</body>
</html>
